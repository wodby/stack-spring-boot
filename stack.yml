name: spring-boot
icon: spring
docs: https://wodby.com/docs/2.0/stacks/catalog/spring-boot/
title: Spring Boot

services:
- name: spring-boot
  title: Spring Boot
  service: spring-boot
  required: true
  main: true
  links:
  - name: db
    service: postgres
  - name: redis
    service: valkey
  - name: sendmail
    service: mailpit
  - name: otel
    service: otel-collector

# The boilerplate stores its data in PostgreSQL and migrates it with Flyway at startup.
- name: postgres
  title: PostgreSQL
  service: postgres
  required: true
  volumes:
  - name: data
    size: 20

- name: valkey
  title: Valkey
  service: valkey
  disabled: true

- name: mailpit
  disabled: true
  title: Mailpit
  service: mailpit

- name: opensmtpd
  disabled: true
  title: OpenSMTPD
  service: opensmtpd

- name: gotenberg
  required: false
  disabled: true
  title: Gotenberg
  service: gotenberg

- name: cloud-postgres
  title: Cloud PostgreSQL
  service: cloud-postgres
  disabled: true

- name: otel-collector
  title: OpenTelemetry Collector
  service: opentelemetry-collector
  disabled: true
  # The application sends telemetry to the Collector inside the environment only.
  endpoints:
  - name: otlp
    ports:
    - name: otlp-http
      private: true
  configs:
  - name: config
    config: configs/otel-collector.yaml
  workloads:
  - name: main
    containers:
    - name: otelcol
      resources:
        request:
          cpu: 100
          memory: 128
        limit:
          cpu: 500
          memory: 512
